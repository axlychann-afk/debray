<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>deuaLA — Nomor Virtual Internasional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0a0e18;
    --navy-card:#131b2c;
    --navy-line:#26314a;
    --gold:#c9a24c;
    --gold-soft:#8a7748;
    --ink:#f0ede3;
    --ink-muted:#8b95b3;
    --stamp-red:#b23b3b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:var(--navy-deep);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:48px 18px 64px;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(201,162,76,0.09), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(201,162,76,0.07), transparent 45%);
  }
  .stage{
    width:100%;
    max-width:460px;
  }

  .kicker{
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--ink-muted);
    margin-bottom:14px;
  }

  /* ---------- Pass shell ---------- */
  .pass{
    background:var(--navy-card);
    border:1px solid var(--navy-line);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 40px 80px -30px rgba(0,0,0,0.7);
  }

  .pass-head{
    padding:30px 28px 24px;
    position:relative;
  }
  .brand-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .brand{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:30px;
    letter-spacing:0.01em;
    color:var(--ink);
  }
  .brand em{
    font-style:normal;
    color:var(--gold);
  }
  .route-code{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink-muted);
    text-align:right;
    line-height:1.5;
  }
  .tagline{
    margin-top:6px;
    font-size:14px;
    color:var(--ink-muted);
    max-width:34ch;
  }

  /* perforation divider */
  .perf{
    position:relative;
    height:0;
    border-top:1.5px dashed var(--navy-line);
    margin:0 0;
  }
  .perf::before,.perf::after{
    content:"";
    position:absolute;
    top:-11px;
    width:22px;
    height:22px;
    background:var(--navy-deep);
    border-radius:50%;
  }
  .perf::before{left:-11px;}
  .perf::after{right:-11px;}

  /* ---------- Destinations table ---------- */
  .routes{
    padding:22px 28px 8px;
  }
  .routes-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.14em;
    color:var(--gold-soft);
    display:flex;
    justify-content:space-between;
    padding-bottom:12px;
    border-bottom:1px solid var(--navy-line);
  }
  .route{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 0;
    border-bottom:1px solid var(--navy-line);
  }
  .route:last-child{border-bottom:none;}
  .route-country{
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .route-country .code{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-muted);
    letter-spacing:0.08em;
  }
  .route-country .name{
    font-size:15.5px;
    font-weight:500;
    color:var(--ink);
  }
  .route-price{
    font-family:'Space Grotesk',sans-serif;
    font-size:17px;
    font-weight:600;
    color:var(--gold);
    white-space:nowrap;
  }

  /* ---------- Payment / QR section ---------- */
  .pay{
    padding:24px 28px 28px;
    text-align:center;
  }
  .pay-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.14em;
    color:var(--gold-soft);
    margin-bottom:16px;
    text-align:left;
  }
  .qr-frame{
    background:#fdfcf8;
    border-radius:12px;
    padding:14px;
    display:inline-block;
  }
  .qr-frame img{
    display:block;
    width:100%;
    max-width:230px;
    height:auto;
    border-radius:4px;
  }
  .nmid{
    margin-top:12px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--ink-muted);
    letter-spacing:0.03em;
  }

  .cta{
    display:block;
    margin:22px auto 0;
    max-width:280px;
    background:var(--gold);
    color:var(--navy-deep);
    text-decoration:none;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:16px;
    letter-spacing:0.02em;
    padding:15px 20px;
    border-radius:10px;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 14px 30px -12px rgba(201,162,76,0.55);
  }
  .cta:hover{transform:translateY(-2px);}
  .cta:active{transform:translateY(0);}
  .cta-sub{
    margin-top:10px;
    font-size:12px;
    color:var(--ink-muted);
  }

  /* ---------- Footer channels ---------- */
  .channels{
    padding:22px 28px 26px;
  }
  .channel{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding:14px 16px;
    border:1px solid var(--navy-line);
    border-radius:10px;
    text-decoration:none;
    color:var(--ink);
    margin-bottom:10px;
    transition:border-color .15s ease, background .15s ease;
  }
  .channel:last-child{margin-bottom:0;}
  .channel:hover{
    border-color:var(--gold-soft);
    background:rgba(201,162,76,0.05);
  }
  .channel-text{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .channel-text .t{
    font-size:14px;
    font-weight:500;
  }
  .channel-text .d{
    font-size:12px;
    color:var(--ink-muted);
  }
  .channel-arrow{
    font-family:'IBM Plex Mono',monospace;
    color:var(--gold);
    font-size:16px;
    flex-shrink:0;
  }

  .stub-foot{
    text-align:center;
    padding:16px 20px 26px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:0.1em;
    color:var(--ink-muted);
    opacity:0.7;
  }

  @media (max-width:380px){
    .brand{font-size:26px;}
    .pass-head,.routes,.pay,.channels{padding-left:20px;padding-right:20px;}
  }
</style>
</head>
